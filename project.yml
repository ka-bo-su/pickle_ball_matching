name: PickleBallMatching
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
targets:
  PickleBallMatchingCore:
    type: framework
    platform: iOS
    sources:
      - Sources/PickleBallMatchingCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  PickleBallMatching:
    type: application
    platform: iOS
    sources:
      - App
      - Features
      - Shared
    dependencies:
      - target: PickleBallMatchingCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kabosu.PickleBallMatching
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
  PickleBallMatchingCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/PickleBallMatchingCoreTests
    dependencies:
      - target: PickleBallMatchingCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
